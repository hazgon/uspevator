name: Publish web app

on:
  push:
    branches: [main]
    paths:
      - 'build_uspevator/**'
      - 'android_uspevator/app/AndroidManifest.xml'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test the HTML app
        run: |
          python3 build_uspevator/build.py
          node build_uspevator/test-run.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build_uspevator/preview/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.repository.has_pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
